<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustMint Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#e9e3d6;color:#1b2530;display:flex;flex-direction:column;align-items:center;padding:20px;}
  h1{font-size:22px;margin:6px 0 2px;}
  p.sub{color:#5a615a;margin:0 0 16px;font-size:13px;}
  #reader{width:320px;max-width:92vw;border:1px solid #b3a992;background:#000;}
  #result{margin-top:18px;width:320px;max-width:92vw;text-align:center;padding:16px;
          border:1px solid #cfc7b6;background:#f3efe6;font-weight:600;font-size:18px;min-height:24px;}
  .valid{color:#2f6b57;border-color:#2f6b57!important;}
  .bad{color:#a8322a;border-color:#a8322a!important;}
  .warnv{color:#8c6d22;border-color:#8c6d22!important;}
  .meta{font-weight:400;font-size:13px;color:#5a615a;margin-top:6px;}
</style>
</head>
<body>
  <h1>TrustMint Scanner</h1>
  <p class="sub">Point the camera at a document QR to verify it.</p>
  <div id="reader"></div>
  <div id="result">Ready to scan…</div>
<script>
const API = "https://w833oaqx0j.execute-api.ap-south-1.amazonaws.com";
const box = document.getElementById("result");
let busy = false;

const scanner = new Html5Qrcode("reader");
Html5Qrcode.getCameras().then(cams => {
  if (cams && cams.length) {
    const cam = cams.find(c => /back|rear|environment/i.test(c.label)) || cams[0];
    scanner.start(cam.id, {fps: 10, qrbox: 240}, onScan).catch(showCamError);
  } else showCamError();
}).catch(showCamError);

async function onScan(text){
  if (busy) return; busy = true;
  box.textContent = "Checking…"; box.className = "";
  try{
    const r = await fetch(API + "/verify", {method:"POST", body: JSON.stringify({qr_hash: text})});
    const d = await r.json();
    render(d);
  }catch(e){ box.textContent = "Network error"; box.className = "bad"; }
  setTimeout(() => busy = false, 2500);
}

function render(d){
  const map = {valid:["VALID","valid"], already_used:["VOID - ALREADY USED","bad"],
               revoked:["REVOKED","bad"], expired:["EXPIRED","warnv"], invalid:["NOT IN REGISTRY","bad"]};
  const [label, cls] = map[d.result] || map.invalid;
  let meta = "";
  if (d.result === "valid"){
    const first = d.payload ? Object.values(d.payload)[0] : "";
    meta = `<div class="meta">${d.type||""} · ${Array.isArray(first)?first.join(", "):(first||"")}</div>`;
  }
  box.className = cls;
  box.innerHTML = label + meta;
}

function showCamError(){ box.textContent = "Camera unavailable - allow camera access, use https or localhost."; box.className = "warnv"; }
</script>
</body>
</html>

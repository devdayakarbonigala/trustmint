AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256

Resources:
  TypesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: types
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: type_id, AttributeType: S}]
      KeySchema: [{AttributeName: type_id, KeyType: HASH}]

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: documents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: doc_id, AttributeType: S}]
      KeySchema: [{AttributeName: doc_id, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  CreateFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: create_document.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: types}
        - DynamoDBCrudPolicy: {TableName: documents}
      Events:
        Api: {Type: HttpApi, Properties: {Path: /create, Method: post}}

  VerifyFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: verify_document.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: types}
        - DynamoDBCrudPolicy: {TableName: documents}
      Events:
        Api: {Type: HttpApi, Properties: {Path: /verify, Method: post}}

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
